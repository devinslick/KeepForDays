name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

      # CI debug keystore -> artifacts update devices in place (same cert
      # as every prior Keep For Days build). Absent secret (forks/PRs) =
      # build.sh generates a throwaway key.
      - name: Restore debug keystore
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > debug.keystore
          keytool -list -keystore debug.keystore -storepass android \
            -alias androiddebugkey | sed -n '1,4p'

      - name: Build
        run: ANDROID_SDK="$ANDROID_HOME" ./build.sh

      - name: Report signing cert
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            keep-for-days-*.apk | sed -n '1,4p'

      - uses: actions/upload-artifact@v4
        with:
          name: keep-for-days-apk
          path: keep-for-days-*.apk

      # Rolling release for Obtainium tracking: versioned tag (Obtainium
      # extracts the version from the tag — a tag without one fails with
      # "Could not find a suitable release"), previous releases dropped
      # so the newest is always the only/latest one.
      - name: Publish rolling release
        run: |
          APK=$(ls keep-for-days-*.apk | head -1)
          VER=$(basename "$APK" | sed -E 's/.*keep-for-days-([0-9.]+)\.apk/\1/')
          TAG="keep-for-days-v$VER"
          for t in $(gh release list --json tagName --jq '.[].tagName' | grep '^keep-for-days-'); do
            gh release delete "$t" --yes --cleanup-tag 2>/dev/null || true
          done
          gh release create "$TAG" "$APK" --latest \
            --title "Keep For Days v$VER" \
            --notes "Rolling CI build of main. Signed with the repo debug key."
        env:
          GH_TOKEN: ${{ github.token }}
